<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar Assistant</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div class="brand">📡 Radar Assistant <span class="sub">local · read-only</span></div>
    <div class="controls">
      <button id="run-btn">Run now</button>
      <button id="stop-btn" class="danger">Emergency stop</button>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <nav id="tabs">
    <button data-tab="priority" class="active">Priority Inbox</button>
    <button data-tab="sales">PeptidePrice Sales</button>
    <button data-tab="community">Community</button>
    <button data-tab="content">Content Opportunities</button>
    <button data-tab="personal">Personal / Admin</button>
    <button data-tab="review">Review History</button>
  </nav>

  <main id="content"><div class="loading">Loading…</div></main>

  <footer id="connector-health"></footer>

  <template id="item-card">
    <article class="card">
      <div class="card-head">
        <span class="badge source"></span>
        <span class="badge priority"></span>
        <span class="badge injection hidden">⚠ possible injection</span>
        <span class="person"></span>
        <a class="open" target="_blank" rel="noopener">Open original ↗</a>
      </div>
      <h3 class="title"></h3>
      <p class="summary"></p>
      <div class="draft-wrap hidden">
        <div class="draft-meta"></div>
        <textarea class="draft"></textarea>
        <div class="actions">
          <button class="copy">Copy response</button>
          <button class="save-review">Save what I posted</button>
          <button class="reject">Reject draft</button>
          <button class="handled">Mark handled</button>
          <button class="snooze">Snooze 24h</button>
        </div>
      </div>
      <div class="actions no-draft hidden">
        <button class="handled">Mark handled</button>
        <button class="snooze">Snooze 24h</button>
      </div>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
